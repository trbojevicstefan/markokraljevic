name: Animation pack 05 QA
on:
  push:
    branches:
      - feat/animation-pack-05-milos-ravijojla
  pull_request:
    paths:
      - art/animation-pack-05/**
      - tools/build-animation-pack05.py
      - tests/animation-pack05-tests.py
      - .github/workflows/animation-pack-05-qa.yml
permissions:
  contents: read
jobs:
  asset-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder dependencies
        run: python -m pip install Pillow numpy
      - name: Compile and validate animation asset builder
        run: |
          python -m py_compile tools/build-animation-pack05.py
          python tests/animation-pack05-tests.py
