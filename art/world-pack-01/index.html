<!doctype html><html lang="sr-Latn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Markov svet · Paket 01</title>
<style>*{box-sizing:border-box}body{margin:0;background:#102322;color:#eee1bc;font:15px system-ui}header,main{padding:28px max(22px,5vw)}h1{font:40px Georgia}p{color:#afc4b7;line-height:1.6}select,button{padding:10px;background:#28463e;color:#f5dfa6;border:1px solid #a68851;border-radius:5px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#1a343a;border:1px solid #597161}nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:18px 0}input{accent-color:#d3ac61}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}article{background:#18312e;border:1px solid #415d4e;border-radius:8px;overflow:hidden}article img{width:100%;height:190px;object-fit:contain;background:repeating-conic-gradient(#294039 0 25%,#243932 0 50%) 0/20px 20px}article div{padding:14px}a{color:#e0bd78}small{color:#b4c5b5}h2{font:28px Georgia}label{color:#bdcdbd}</style>
<header><small>MARKO · BIBLIOTEKA SVETA / 01</small><h1>Predeli, putevi i prepreke</h1><p>Šest novih ambijenata, slojevi za parallax i pojedinačni objekti za slaganje nivoa. Pregled rasporeda prikazuje plan terena i dekoraciju.</p><nav><select id="level"></select><button id="auto">Pauziraj kameru</button><label>Kamera <input id="camera" type="range" min="0" max="4960" value="0" style="width:220px"></label><label><input id="terrain" type="checkbox" checked> Prikaži plan platformi</label></nav><canvas id="world" width="1280" height="720"></canvas><p id="status"></p></header><main><h2>Biblioteka resursa</h2><nav><select id="filter"><option value="all">Sve slike</option><option value="prop">Objekti</option><option value="sky">Nebo</option><option value="far">Daljina</option><option value="mid">Srednji plan</option><option value="near">Bliski plan</option><option value="vista">Panorame nivoa</option></select><span id="count"></span><a href="levels.json">Rasporedi nivoa JSON</a></nav><div id="gallery"></div></main><script src="catalog.js"></script><script>
const images=new Map(),byId=new Map(WORLD.assets.map(a=>[a.id,a]));for(const a of WORLD.assets){const i=new Image();i.src=a.file;images.set(a.id,i)}const select=document.querySelector('#level');for(const l of WORLD.levels)select.add(new Option(l.name,l.id));let active=WORLD.levels[0],cam=0,auto=true,last=0;select.onchange=()=>{active=WORLD.levels.find(l=>l.id===select.value);cam=0};document.querySelector('#auto').onclick=()=>{auto=!auto;document.querySelector('#auto').textContent=auto?'Pauziraj kameru':'Pokreni kameru'};document.querySelector('#camera').oninput=e=>{cam=+e.target.value;auto=false;document.querySelector('#auto').textContent='Pokreni kameru'};
const g=document.querySelector('canvas').getContext('2d');function ready(i){return i&&i.complete&&i.naturalWidth}function frame(t){if(auto&&last)cam=(cam+Math.min(.05,(t-last)/1000)*100)%(active.width-1280);last=t;document.querySelector('#camera').value=cam;g.clearRect(0,0,1280,720);g.fillStyle='#27434a';g.fillRect(0,0,1280,720);let loaded=0;for(const layer of active.layers){const im=images.get(layer.id);if(!ready(im))continue;loaded++;const w=im.width*(720/im.height),x=-((cam*layer.speed)%w);for(let p=x;p<1280;p+=w)g.drawImage(im,p,0,w,720)}if(document.querySelector('#terrain').checked){for(const p of active.platforms){g.fillStyle='#394537';g.fillRect(p.x-cam,p.y,p.w,p.h);g.fillStyle='#a5a66c';g.fillRect(p.x-cam,p.y,p.w,5)}}for(const p of active.props){const im=images.get(p.id),a=byId.get(p.id);if(!ready(im)||!a.bounds)continue;const [x,y,r,b]=a.bounds,h=b-y,w=r-x,s=p.height/h;g.drawImage(im,x,y,w,h,p.x-cam-w*s/2,p.y-h*s,w*s,h*s)}g.fillStyle='#f7db83';g.font='16px system-ui';g.fillText(active.name,30,38);document.querySelector('#status').textContent=`${active.name} · ${loaded}/4 sloja dostupna · plan 6240 px · brzine slojeva 0,04 / 0,16 / 0,38 / 0,72`;requestAnimationFrame(frame)}requestAnimationFrame(frame);
function gallery(){const kind=document.querySelector('#filter').value,assets=WORLD.assets.filter(a=>kind==='all'||a.kind===kind);document.querySelector('#count').textContent=assets.length+' resursa';document.querySelector('#gallery').innerHTML=assets.map(a=>`<article><a href="${a.file}"><img loading="lazy" src="${a.file}" alt="${a.id}"></a><div><b>${a.id}</b><p>${a.title}</p><small>${a.width} × ${a.height} · ${a.hasTransparency?'providna pozadina':'puna pozadina'}</small><p><a href="${a.file}" download>Preuzmi PNG</a></p></div></article>`).join('')}document.querySelector('#filter').onchange=gallery;gallery();
</script></html>
