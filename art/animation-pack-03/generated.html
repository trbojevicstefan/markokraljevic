<!doctype html><html lang="sr-Latn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Marko · Pokret i borba / Animacije 03</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d191a;color:#f0e4c9;font:15px system-ui}header{padding:40px max(24px,6vw) 24px;border-bottom:1px solid #b5985c40;background:linear-gradient(120deg,#243a37,#101e22)}small{color:#d2b577;letter-spacing:3px;font-size:11px}h1{font:42px Georgia;margin:12px 0}p{color:#afbeb6;line-height:1.6}nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap}button,a.button{border:1px solid #b89955;background:#283e38;color:#f6dfaa;padding:10px 20px;border-radius:4px;cursor:pointer;text-decoration:none}input{accent-color:#dcad58}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:22px;padding:30px max(24px,6vw)}article{border:1px solid #50605866;background:#152527;border-radius:8px;overflow:hidden}article>div{padding:18px 22px}h2{font:24px Georgia;margin:7px 0}canvas{display:block;width:100%;height:auto;background:radial-gradient(ellipse at 50% 80%,#35483a,#101e23 75%)}footer{display:flex;justify-content:space-between;border-top:1px solid #50605866;padding:12px 20px;font-size:12px}a{color:#dec185}.badge{font:10px system-ui;letter-spacing:2px;color:#a3c5b6}.frame{color:#a3c5b6}body>footer{margin:0 6vw 30px}label{color:#c2d0c7;font-size:13px}</style>
<header><small>MARKO · BIBLIOTEKA ANIMACIJA / 03</small><h1>Pokret i borba · Paket 03</h1><p>Nacrtani klipovi paketa 03. Pauziraj i prođi kroz kadrove za proveru pokreta.</p><nav><button id="play">Pauziraj</button><label>Brzina <input id="speed" type="range" min="0.25" max="1.5" value="1" step=".25"> <span id="speedLabel">1×</span></label><label><input id="facing" type="checkbox"> Okreni ulevo</label><button id="step">Sledeći kadar</button></nav></header><main id="cards"></main><footer><span>PNG sa alpha kanalom · pojedinačni kadrovi · JSON manifest · GIF pregled</span><a href="README.md">Uputstvo za integraciju</a></footer><script src="generated-catalog.js"></script><script>
let playing=true,speed=1,clock=0,last=0,manual=null;const cards=[];
for(const item of CATALOG){const card=document.createElement('article');card.innerHTML=`<div><span class="badge">${item.id.split('-')[0].toUpperCase()}</span><h2>${item.id}</h2></div><canvas width="480" height="340"></canvas><div><p>${item.loop?'Petlja':'Jednokratna animacija'}</p></div><footer><span class="frame"></span><span><a href="assets/${item.id}/atlas.png">PNG</a> · <a href="assets/${item.id}/manifest.json">JSON</a> · <a href="previews/${item.id}.gif">GIF</a></span></footer>`;document.querySelector('#cards').append(card);const image=new Image();image.src=`assets/${item.id}/atlas.png`;cards.push({item,card,image,g:card.querySelector('canvas').getContext('2d')});}
document.querySelector('#play').onclick=()=>{playing=!playing;if(playing)manual=null;document.querySelector('#play').textContent=playing?'Pauziraj':'Pokreni';};document.querySelector('#speed').oninput=e=>{speed=+e.target.value;document.querySelector('#speedLabel').textContent=speed+'×';};document.querySelector('#step').onclick=()=>{playing=false;manual=((manual??0)+1)%24;document.querySelector('#play').textContent='Pokreni';};
function draw(now){if(playing&&last)clock+=Math.max(0,now-last)/1000*speed;last=now;for(const {item,card,image,g}of cards){g.clearRect(0,0,480,340);const n=manual===null?Math.min(item.frames.length-1,Math.floor(clock*item.fps)%(item.loop?item.frames.length:item.frames.length+4)):manual%item.frames.length,f=item.frames[n];card.querySelector('.frame').textContent=`KADAR ${n+1} / ${item.frames.length} · ${item.fps} FPS`;if(!image.complete||!image.naturalWidth)continue;const k=item.id==='orao-flight'?.73:.58;let y=item.id==='orao-flight'?170:302;if(item.id==='akindzija-jump')y-=[0,12,58,42,0,0][n];g.save();if(item.id!=='orao-flight'){g.fillStyle='#07141670';g.beginPath();g.ellipse(240,305,62,7,0,0,Math.PI*2);g.fill();}g.translate(240,y);g.scale(document.querySelector('#facing').checked?-1:1,1);g.drawImage(image,f.x,f.y,f.w,f.h,-f.w*k/2,-(item.id==='orao-flight'?f.h/2:f.h-24)*k,f.w*k,f.h*k);g.restore();}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
